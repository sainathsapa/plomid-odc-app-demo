[project]
name = "plomid-odc"
version = "0.1.0"
description = "PLOMID ODC — cabin occupant intelligence (Phase 1: contracts + foundation)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]
inference = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "timm==1.0.30",
    "transformers==5.19.0",
    "safetensors>=0.5",
]
# Phase 3+: opencv-python-headless | Phase 4+: onnxruntime, numpy
# Phase 8+: fastapi, uvicorn[standard], jinja2, python-multipart, httpx

[project.scripts]
odc = "odc.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF100"]
ignore = [
    "UP042", # keep (str, Enum) mixin: stable pydantic/JSON behavior across versions
    "UP046", # keep Generic[T]: canonical pydantic generic-model idiom
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"] # SQL literals in evidence scripts read better unwrapped

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
